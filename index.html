<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flora & sienna | Handmade Blooms</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --pink-light: #fce8e8; --pink-accent: #e8b4b8; --pink-dark: #d49a9e; --text-dark: #3a3333; --white: #ffffff; }
        body { font-family: 'Poppins', sans-serif; color: var(--text-dark); margin: 0; padding: 0; scroll-behavior: smooth; background-color: #faf7f7; background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23e8b4b8' fill-opacity='0.1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
        a { text-decoration: none; color: var(--text-dark); }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 1rem 5%; background: rgba(255, 255, 255, 0.95); position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 5px rgba(0,0,0,0.02); }
        .nav-links { display: flex; gap: 2rem; font-size: 0.85rem; text-transform: uppercase; font-weight: 500; }
        .logo img { max-height: 50px; } 
        section { padding: 4rem 5%; max-width: 1000px; margin: 0 auto; }
        .section-title { text-align: center; font-size: 2.5rem; margin-bottom: 2rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 2rem; }
        .card { background: var(--white); border-radius: 16px; padding: 1.2rem; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .card img { width: 100%; height: 260px; object-fit: cover; border-radius: 12px; margin-bottom: 1rem; }
        .price { color: var(--pink-dark); font-weight: 600; margin-bottom: 1rem; }
        .custom-form-container { background: var(--white); padding: 3rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
        .form-group { margin-bottom: 1.5rem; } 
        label { display: block; font-weight: 500; margin-bottom: 0.5rem; }
        input, select, textarea { width: 100%; padding: 0.8rem; border: 1px solid #e8dfdf; border-radius: 8px; font-family: inherit; box-sizing: border-box; }
        .hidden { display: none; }
        .btn-submit { background-color: var(--pink-dark); color: var(--white); padding: 1rem; border: none; border-radius: 8px; width: 100%; font-size: 1rem; cursor: pointer; font-weight: 600; margin-top: 1rem; }
        #receipt-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 1000; justify-content: center; align-items: center; }
        .receipt-box { background: white; padding: 3rem; border-radius: 16px; text-align: center; border-top: 10px solid var(--pink-dark); max-width: 400px; width: 90%; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-links"><a href="#home">Home</a><a href="#menu">On-Hand</a></div>
        <div class="logo"><img src="logo.png" alt="flora & sienna"></div>
        <div class="nav-links"><a href="#myworks">My Works</a><a href="#custom">Custom Order</a></div>
    </nav>

    <section id="myworks">
        <h2 class="section-title">My Works</h2>
        <div class="grid" id="works-grid"><p style="text-align:center; grid-column: 1/-1;">Loading works...</p></div>
    </section>

    <section id="menu">
        <h2 class="section-title">On-Hand Items</h2>
        <div class="grid" id="onhand-grid"><p style="text-align:center; grid-column: 1/-1;">Loading items...</p></div>
    </section>

    <section id="custom">
        <h2 class="section-title">Design Your Bouquet</h2>
        <div class="custom-form-container">
            <form id="orderForm">
                <div class="form-group">
                    <label>1. Choose Material</label>
                    <select id="material" required>
                        <option value="" disabled selected>Select...</option>
                        <option value="Fuzzy Wire">Fuzzy Wire</option>
                        <option value="Satin Ribbon">Satin Ribbon</option>
                        <option value="Inspo Picture">Inspo Picture</option>
                    </select>
                </div>
                <div class="form-group hidden" id="photo-only-group">
                    <label>Upload Inspiration Photo</label>
                    <input type="file" id="inspo-file" accept="image/*">
                </div>
                <div id="standard-options">
                    <div class="form-group">
                        <label>2. Budget (₱)</label>
                        <select id="budget">
                            <option value="300">₱300</option>
                            <option value="500">₱500</option>
                            <option value="1000">₱1000</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Details</label>
                        <textarea id="flower-details"></textarea>
                    </div>
                </div>
                <div class="form-group"><label>Full Name</label><input type="text" id="c-name" required></div>
                <div class="form-group"><label>FB Link</label><input type="text" id="c-fb" required></div>
                <div class="form-group"><label>Contact</label><input type="text" id="c-number" required></div>
                <button type="submit" class="btn-submit">Place Order</button>
            </form>
        </div>
    </section>

    <div id="receipt-modal"><div class="receipt-box"><h2 id="r-name"></h2><p>Order Sent! Please wait for our message.</p><button class="btn-submit" onclick="location.reload()">Close</button></div></div>

    <script>
        // PALITAN MO ITO NG RENDER URL MO KUNG IBA ANG NASA DASHBOARD MO
        const BASE_URL = 'https://flora-sienna-shop.onrender.com';

        const materialSelect = document.getElementById('material');
        materialSelect.addEventListener('change', (e) => {
            if (e.target.value === 'Inspo Picture') {
                document.getElementById('photo-only-group').classList.remove('hidden');
                document.getElementById('standard-options').classList.add('hidden');
            } else {
                document.getElementById('photo-only-group').classList.add('hidden');
                document.getElementById('standard-options').classList.remove('hidden');
            }
        });

        // Load On-Hand
        fetch(`${BASE_URL}/api/onhand`).then(res => res.json()).then(data => {
            const grid = document.getElementById('onhand-grid');
            grid.innerHTML = data.length ? data.map(item => `<div class="card"><img src="${item.image}"><h3>${item.name}</h3><p class="price">₱${item.price}</p></div>`).join('') : 'No items yet.';
        });

        // Load My Works
        fetch(`${BASE_URL}/api/myworks`).then(res => res.json()).then(data => {
            const grid = document.getElementById('works-grid');
            grid.innerHTML = data.length ? data.map(item => `<div class="card"><img src="${item.image}"></div>`).join('') : 'No works added yet.';
        });

        const getBase64 = (file) => new Promise((res, rej) => {
            const reader = new FileReader(); reader.readAsDataURL(file);
            reader.onload = () => res(reader.result); reader.onerror = e => rej(e);
        });

        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            let img = null;
            const file = document.getElementById('inspo-file').files[0];
            if (file) img = await getBase64(file);

            const order = {
                material: materialSelect.value,
                budget: document.getElementById('budget').value,
                details: document.getElementById('flower-details').value,
                name: document.getElementById('c-name').value,
                fb: document.getElementById('c-fb').value,
                contact: document.getElementById('c-number').value,
                inspoImage: img,
                orderDate: new Date().toLocaleString()
            };

            try {
                await fetch(`${BASE_URL}/api/orders`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(order)
                });
                document.getElementById('receipt-modal').style.display = 'flex';
            } catch (err) {
                alert("Server Error! Siguraduhing Live ang Render.");
            }
        });
    </script>
</body>
</html>
