<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | flora & sienna</title>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #faf7f7; padding: 20px; color: #333; }
        .panel { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, select, textarea { margin: 10px 0; padding: 10px; width: 100%; box-sizing: border-box; border: 1px solid #ddd; border-radius: 5px; }
        button { background: #d49a9e; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #e8b4b8; }
        .order-card { border-left: 5px solid #d49a9e; background: #fffcfc; padding: 15px; margin-top: 10px; border-radius: 5px; position: relative; }
        img { max-width: 150px; display: block; margin: 10px 0; border-radius: 5px; border: 1px solid #ddd; }
        .status-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.8rem; background: #eee; }
    </style>
</head>
<body>
    <h1>🌸 Admin Dashboard</h1>
    
    <div class="panel">
        <h2>Add to "My Works"</h2>
        <p>I-upload ang litrato ng iyong mga nagawang bouquet.</p>
        <input type="file" id="work-file" accept="image/*">
        <button onclick="addWork()">Upload Work</button>
    </div>

    <div class="panel">
        <h2>Add to "On-Hand"</h2>
        <p>I-add ang mga available bouquets na pwedeng bilhin agad.</p>
        <input type="text" id="oh-name" placeholder="Bouquet Name">
        <input type="number" id="oh-price" placeholder="Price">
        <input type="file" id="oh-file" accept="image/*">
        <button onclick="addOnHand()">Add to Menu</button>
    </div>

    <div class="panel">
        <h2>Recent Orders</h2>
        <div id="orders-list">Loading orders...</div>
    </div>

    <script>
        // PALITAN MO ITO NG RENDER URL MO KUNG IBA ANG NASA DASHBOARD MO
        const BASE_URL = 'https://flora-sienna-shop.onrender.com';

        const getBase64 = (file) => new Promise((res, rej) => {
            const reader = new FileReader(); reader.readAsDataURL(file);
            reader.onload = () => res(reader.result); reader.onerror = e => rej(e);
        });

        async function addWork() {
            const file = document.getElementById('work-file').files[0];
            if(!file) return alert("Pumili muna ng litrato.");
            const img = await getBase64(file);
            try {
                await fetch(`${BASE_URL}/api/myworks`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ image: img })
                });
                alert("Work Added Successfully!");
                location.reload();
            } catch (e) { alert("Error uploading."); }
        }

        async function addOnHand() {
            const file = document.getElementById('oh-file').files[0];
            const name = document.getElementById('oh-name').value;
            const price = document.getElementById('oh-price').value;
            if(!file || !name || !price) return alert("Paki-fill up lahat.");
            const img = await getBase64(file);
            try {
                await fetch(`${BASE_URL}/api/onhand`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ name, price, image: img })
                });
                alert("On-Hand Item Added!");
                location.reload();
            } catch (e) { alert("Error uploading."); }
        }

        async function loadOrders() {
            try {
                const res = await fetch(`${BASE_URL}/api/orders`);
                const orders = await res.json();
                const list = document.getElementById('orders-list');
                if (orders.length === 0) { list.innerHTML = "No orders yet."; return; }
                
                list.innerHTML = orders.reverse().map(o => `
                    <div class="order-card">
                        <strong>Customer:</strong> ${o.name}<br>
                        <strong>Contact:</strong> ${o.contact}<br>
                        <strong>Style:</strong> ${o.material} | <strong>Budget:</strong> ₱${o.budget}<br>
                        <strong>Details:</strong> ${o.details || 'No details'}<br>
                        ${o.inspoImage ? `<p><strong>Inspo Photo:</strong></p><img src="${o.inspoImage}">` : ''}
                        <br>
                        <a href="${o.fb}" target="_blank" style="color: #0084FF;">View FB Profile</a>
                        <p style="font-size: 0.7rem; color: #888;">Order Date: ${o.orderDate}</p>
                    </div>
                `).join('');
            } catch (e) { console.log("Error loading orders."); }
        }
        
        setInterval(loadOrders, 5000);
        loadOrders();
    </script>
</body>
</html>
